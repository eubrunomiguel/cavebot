function:[[

-- BUY MANA POTIONS

local npc = getCreatureByName("Xodet")

if not npc then

  return false

end

if retries > 10 then

  return false

end

local count = player:getItemsCount(storage.manaId)

-- Already have enough

if count >= storage.manaTarget then

  return true

end

local pos = player:getPosition()

local npcPos = npc:getPosition()

-- Walk to NPC if too far

if math.max(

  math.abs(pos.x - npcPos.x),

  math.abs(pos.y - npcPos.y)

) > 3 then

  autoWalk(npcPos, {precision = 3})

  return "retry"

end

-- Open trade

if not NPC.isTrading() then

  NPC.say("hi")

  schedule(1000, function()

    NPC.say("trade")

  end)

  delay(2000)

  return "retry"

end

-- Buy only what is needed

NPC.buy(storage.manaId, 100)

schedule(2000, function()

  NPC.closeTrade()

  NPC.say("bye")

end)

delay(3000)

return true


]]
