function:[[

-- CAVEBOT CONFIG

storage.manaId = 268

storage.manaTarget = 1700

storage.hpId = 7643

storage.hpTarget = 500

-- Minimum supplies before leaving hunt

storage.manaHuntMin = 350

storage.hpHuntMin = 100

-- Emergency supplies

storage.manaEmergency = 50

storage.hpEmergency = 50

-- Emergency escape spell

storage.emergencySpell = "utani tempo hur"

-- Deposit items

storage.depositItem1 = 3428

storage.depositItem1Price = 8000

storage.depositItem2 = 7402

storage.depositItem2Price = 15000

storage.depositItem3 = 3386

storage.depositItem3Price = 40000

storage.depositItem4 = 3392

storage.depositItem4Price = 30000

-- Keep this action successful

return true


]]
function:[[

-- ITEMS TO DEPOSIT?

if player:getItemsCount(storage.depositItem1) > 1

or player:getItemsCount(storage.depositItem2) > 1

or player:getItemsCount(storage.depositItem3) > 1

or player:getItemsCount(storage.depositItem4) > 1 then

  gotoLabel("dp")

  return true

end

return true


]]
