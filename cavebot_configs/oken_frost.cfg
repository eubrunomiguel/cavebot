function:[[

-- CHECK SUPPLIES

if player:getItemsCount(storage.manaId) < storage.manaTarget

or player:getItemsCount(storage.hpId) < storage.hpTarget then

  gotoLabel("xodet")

  return true

end

-- CHECK ITEMS TO DEPOSIT

if player:getItemsCount(storage.depositItem1) <= 1

and player:getItemsCount(storage.depositItem2) <= 1

and player:getItemsCount(storage.depositItem3) <= 1

and player:getItemsCount(storage.depositItem4) <= 1 then

  gotoLabel("gotoHunt")

  return true

end

return true


]]
